<style>
  :root { color-scheme: light dark; font: 13px -apple-system, sans-serif; }
  body { margin: 0; padding: 14px; }
  #app, .parameters { display: grid; gap: 12px; }
  header { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
  h2 { margin: 3px 0; font-size: 17px; letter-spacing: -.02em; overflow-wrap: anywhere; }
  label { display: grid; gap: 5px; font-size: 12px; font-weight: 600; min-width: 0; }
  input, button { font: inherit; color: inherit; }
  input { box-sizing: border-box; min-width: 0; width: 100%; padding: 7px 9px; border-radius: 8px;
    background: color-mix(in srgb, Canvas 40%, transparent); border: 1px solid color-mix(in srgb, currentColor 17%, transparent); }
  input:focus-visible, button:focus-visible { outline: 2px solid Highlight; outline-offset: 2px; }
  button { border: 0; border-radius: 8px; padding: 6px 9px;
    background: color-mix(in srgb, currentColor 8%, transparent); }
  button:hover { background: color-mix(in srgb, currentColor 14%, transparent); }
  .control { flex-shrink: 0; font-size: 12px; }
  .parameter { display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    padding: 10px; border-radius: 10px; background: color-mix(in srgb, currentColor 5%, transparent); }
  code { grid-column: 1 / -1; opacity: .7; overflow-wrap: anywhere; }
  .result { display: grid; justify-items: center; gap: 10px; margin-top: 2px; }
  .qr-tile { display: grid; width: min(140px, 100%); background: white; border-radius: 12px; overflow: hidden; }
  .qr-tile img { width: 100%; height: auto; image-rendering: pixelated; }
  .copy { width: 100%; overflow-wrap: anywhere; text-align: center; font-size: 12px; }
  small { opacity: .72; line-height: 1.4; }
</style>
<main id="app"></main>
